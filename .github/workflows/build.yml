name: build

# Builds distributable zips for every supported platform on each push to
# modern-port; a tag push (v*) additionally attaches them to a GitHub Release.
# gm-cli provisions a guest GameMaker license on the runner -- no account
# secrets needed. The macOS job signs + notarizes only when the signing
# secrets exist; otherwise it ships an unsigned zip (right-click > Open).
#
# Platform notes (GameMaker 2026 runtime):
# - macOS: the VM runner is a universal binary (arm64 + x86_64), one artifact.
# - Windows: x64, Windows 10+ (YoYo dropped Windows 7 at runtime 2024.11).
# - Linux: 64-bit only; x64 and arm64 zips. The game's OS floor comes from
#   YoYo's prebuilt runner, not the build host.

on:
  push:
    branches: [master, modern-port]
    tags: ['v*']
  workflow_dispatch:

env:
  PROJECT_DIR: Modern port (GameMaker 2024, working)/BarkleyV110.gmx/BarkleyV110

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,        target: mac,     name: macos-universal }
          - { os: windows-2025,    target: windows, name: windows-x64 }
          - { os: ubuntu-22.04,    target: linux,   name: linux-x64 }
          - { os: ubuntu-22.04-arm, target: linux,  name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Package
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx @gamemaker/gm-cli@latest package BarkleyV110.yyp \
            --target ${{ matrix.target }} --errors-only \
            -o "${{ github.workspace }}/dist/barkley-${{ matrix.name }}.zip"

      - name: Check signing secrets
        id: cansign
        if: matrix.target == 'mac'
        shell: bash
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          NOTARY: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$CERT" ] && [ -n "$NOTARY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign and notarize (macOS)
        if: matrix.target == 'mac' && steps.cansign.outputs.ok == 'true'
        shell: bash
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" login.keychain-db

          WORK="$RUNNER_TEMP/sign"
          mkdir -p "$WORK"
          unzip -q "dist/barkley-macos-universal.zip" -d "$WORK"
          APP=$(find "$WORK" -maxdepth 2 -name "*.app" | head -1)
          codesign --force --deep --options runtime --timestamp \
            --entitlements .github/entitlements.plist \
            -s "Developer ID Application" "$APP"
          codesign --verify --deep --strict "$APP"

          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP"

          rm dist/barkley-macos-universal.zip
          ditto -c -k --keepParent "$APP" dist/barkley-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: barkley-${{ matrix.name }}
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
