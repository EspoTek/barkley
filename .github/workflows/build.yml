name: build

# Builds distributables for every supported platform on each push to
# master/modern-port; a tag push (v*) additionally attaches them to a GitHub
# Release. gm-cli provisions a guest GameMaker license on the runner -- no
# account secrets needed. The macOS job produces a drag-to-Applications DMG
# (Spalding-dimension background) plus a zip, signed + notarized + stapled
# when the Developer ID secrets are present, unsigned otherwise.
#
# Platform notes (GameMaker 2026 runtime):
# - macOS: the VM runner is a universal binary (arm64 + x86_64), one artifact.
# - Windows: x64, Windows 10+ (YoYo dropped Windows 7 at runtime 2024.11).
# - Linux: 64-bit only; x64 and arm64 zips. The game's OS floor comes from
#   YoYo's prebuilt runner, not the build host.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  PROJECT_DIR: barkley_gm2024/BarkleyV110.gmx/BarkleyV110

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,        target: mac,     name: macos-universal, timeout: 75 }
          - { os: windows-2025,    target: windows, name: windows-x64, timeout: 35 }
          - { os: ubuntu-22.04,    target: linux,   name: linux-x64, timeout: 35 }
          - { os: ubuntu-22.04-arm, target: linux,  name: linux-arm64, timeout: 35 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      # GMAssetCompiler shells out to ffmpeg/ffprobe for sound conversion and
      # hangs (until the step timeout) when they're missing. GitHub's mac and
      # windows images ship ffmpeg; the ubuntu images don't.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # The guest license gm-cli auto-provisions has no Windows.build_module
      # (mac/linux/operagx only), so the Windows job needs a real account
      # license: issue a key at https://gamemaker.io/en/account/access-keys and
      # store it as the GM_ACCESS_KEY secret. Harmless no-op when unset.
      - name: GameMaker login
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GM_ACCESS_KEY: ${{ secrets.GM_ACCESS_KEY }}
        run: |
          if [ -z "$GM_ACCESS_KEY" ]; then
            echo "GM_ACCESS_KEY secret not set; staying on the guest license"
            exit 0
          fi
          npx @gamemaker/gm-cli@latest login "$GM_ACCESS_KEY"

      - name: Package
        timeout-minutes: 25
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p "${{ github.workspace }}/dist"
          npx @gamemaker/gm-cli@latest package BarkleyV110.yyp \
            --target ${{ matrix.target }} --verbose \
            -o "${{ github.workspace }}/dist/barkley-${{ matrix.name }}.zip"

      - name: Check signing secrets
        id: cansign
        if: matrix.target == 'mac'
        shell: bash
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          NOTARY: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$CERT" ] && [ -n "$NOTARY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unpack app (macOS)
        if: matrix.target == 'mac'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          unzip -q dist/barkley-macos-universal.zip -d "$RUNNER_TEMP/app"

      - name: Sign and notarize the app (macOS)
        if: matrix.target == 'mac' && steps.cansign.outputs.ok == 'true'
        shell: bash
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" login.keychain-db

          APP=$(find "$RUNNER_TEMP/app" -maxdepth 2 -name "*.app" | head -1)
          codesign --force --deep --options runtime --timestamp \
            --entitlements .github/entitlements.plist \
            -s "Developer ID Application" "$APP"
          codesign --verify --deep --strict "$APP"

          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP"

          rm dist/barkley-macos-universal.zip
          ditto -c -k --keepParent "$APP" dist/barkley-macos-universal.zip

      - name: Create DMG (macOS)
        if: matrix.target == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          brew install create-dmg
          ok=false
          for i in 1 2 3; do
            if create-dmg \
              --volname "Barkley Gaiden" \
              --background .github/dmg-background.png \
              --window-size 640 480 \
              --icon-size 100 \
              --icon "BarkleyV110.app" 160 330 \
              --app-drop-link 480 330 \
              dist/barkley-macos-universal.dmg "$RUNNER_TEMP/app"; then
              ok=true; break
            fi
            echo "create-dmg attempt $i failed; retrying"
            rm -f dist/barkley-macos-universal.dmg
            sleep 5
          done
          $ok

      - name: Sign and notarize the DMG (macOS)
        if: matrix.target == 'mac' && steps.cansign.outputs.ok == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          codesign --force --timestamp -s "Developer ID Application" dist/barkley-macos-universal.dmg
          xcrun notarytool submit dist/barkley-macos-universal.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/barkley-macos-universal.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: barkley-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.dmg
